name: PromptGuard CI/CD Pipeline

on:
  push:
    branches:
      - main
      - "feature/**"
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Run Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest suite
        run: python -m pytest -v

  docker:
    name: Build & Verify Docker Image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check Docker Hub Credentials
        id: dockerhub-check
        run: |
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "has_dockerhub=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_dockerhub=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Docker Hub
        if: steps.dockerhub-check.outputs.has_dockerhub == 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Target Registries
        id: registries
        run: |
          IMAGES="ghcr.io/${{ github.repository }}"
          if [ "${{ steps.dockerhub-check.outputs.has_dockerhub }}" = "true" ]; then
            IMAGES="${{ secrets.DOCKERHUB_USERNAME }}/promptguard
ghcr.io/${{ github.repository }}"
          fi
          {
            echo "images<<EOF"
            echo "$IMAGES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.registries.outputs.images }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}

      - name: Build Docker image for verification
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: promptguard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container Smoke & Health Check
        run: |
          docker run -d --name promptguard-ci -p 8000:8000 promptguard:ci
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then
              echo "Backend health check passed successfully!"
              docker logs promptguard-ci
              docker stop promptguard-ci
              exit 0
            fi
            echo "Waiting for backend service to become ready ($i/30)..."
            sleep 1
          done
          echo "Health check failed or timed out!"
          docker logs promptguard-ci
          docker stop promptguard-ci
          exit 1

      - name: Build and Push Docker image (main branch & release tags)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
